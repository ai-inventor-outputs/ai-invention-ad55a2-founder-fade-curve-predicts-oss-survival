[project]
name = "founder-fade-oss-survival"
version = "0.1.0"
description = "Testing Founder Fade Curves as Predictors of OSS Survival - Experiment implementation"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.2",
    "pandas==3.0.5",
    "scikit-learn==1.9.0",
    "scipy==1.18.0",
    "loguru==0.7.3",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]